name: build

on:
  push:
    branches: [new-v2.1, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Linux: apt Qt 6, Ninja, ctest
  linux:
    name: Linux · Qt 6 · ctest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build lua5.4 qt6-base-dev qt6-svg-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify standalone Lua diagram generator
        run: |
          test ! -e tools/make_diagrams.py
          generated="$RUNNER_TEMP/diagrams"
          mkdir -p "$generated"
          lua5.4 tools/make_diagrams.lua "$generated"
          python3 - "$generated" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          generated = Path(sys.argv[1])
          assets = Path("assets/diagrams")
          outputs = sorted(generated.glob("*.svg"))
          tracked = sorted(assets.glob("*.svg"))
          if len(outputs) != 13 or [p.name for p in outputs] != [p.name for p in tracked]:
              raise SystemExit("Expected 13 Lua outputs matching assets/diagrams")
          ns = "{http://www.w3.org/2000/svg}"
          for output, asset in zip(outputs, tracked):
              root = ET.parse(output).getroot()
              title = root.find(ns + "title")
              desc = root.find(ns + "desc")
              if (root.tag != ns + "svg" or title is None or desc is None
                      or title.get("id") != "diagram-title" or desc.get("id") != "diagram-description"
                      or root.get("role") != "img"):
                  raise SystemExit(f"{output} is missing accessible SVG metadata")
              if root.get("shape-rendering") != "geometricPrecision":
                  raise SystemExit(f"{output} is missing high-quality rendering settings")
              if output.read_bytes() != asset.read_bytes():
                  raise SystemExit(f"{asset} is stale; regenerate with tools/make_diagrams.lua")
          print(f"Validated {len(outputs)} reproducible SVG diagrams")
          PY

      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Annotate compiler warnings
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path("build.log")
          if log.exists():
              warnings = list(dict.fromkeys(line.strip() for line in log.read_text(errors="replace").splitlines()
                                            if "warning:" in line))
              if warnings:
                  message = " | ".join(warnings).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::warning title=compiler warnings::{message}")
          PY

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log

      # Retain the visual artifact for review even when the tests expose an unrelated regression.
      - name: Capture UI screenshots
        id: capture_screenshots
        if: always() && steps.build.outcome == 'success'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/src/PHY104OpticalAssistant --screenshots build/screenshots
          test -s build/screenshots/dashboard_updated_header.png
          test -s build/screenshots/dashboard_arabic.png
          test -s build/screenshots/state_tir_arabic.png

      - name: Upload UI screenshots
        if: always() && steps.capture_screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error

      # Capture and display actual compiler errors from build.log
      - name: Annotate build errors
        if: failure()
        run: |
          log=build.log
          [ -f "$log" ] || exit 0
          errors=$(grep -aE "error:" "$log" | head -10)
          if [ -n "$errors" ]; then
            echo "$errors" | while read -r line; do
              echo "::error title=build error::${line}"
            done
          fi

      # a failing test shows up in the PR page, not only in the (large) job log
      - name: Annotate failing tests
        if: failure()
        run: |
          log=ctest.log
          [ -f "$log" ] || exit 0
          grep -aE "FAIL:|FAIL!|QFATAL|Segmentation|Aborted|Test #[0-9]+: .*Failed|The following tests FAILED|Errors while running CTest" "$log" | head -30 | while read -r line; do
            echo "::error title=failing test::${line}"
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            ctest.log
            build/Testing/**/LastTest.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------ Windows: MSVC + aqt Qt 6
  windows:
    name: Windows · MSVC · ctest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # aqtinstall breaks on the (very new) default Python of the runner: pin a known interpreter first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # aqtinstall directly (the action used to hide the real error); the log lines become annotations if it fails
      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check "aqtinstall==3.3.*" py7zr
          # no -m qtsvg: QtSvg lives inside qtbase since Qt 6
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir C:/Qt 2>&1 |
            Tee-Object -FilePath qtinstall.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content qtinstall.log -Tail 15 | ForEach-Object { Write-Host "::error title=aqt::$_" }
            exit 1
          }
          "QT_ROOT_DIR=C:/Qt/6.8.3/msvc2022_64" >> $env:GITHUB_ENV
          "C:/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ": error|error C[0-9]|error LNK" | Select-Object -First 25 |
              ForEach-Object { Write-Host "::error title=build::$($_.Line)" }
            exit 1
          }

      - name: Annotate compiler warnings
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $warnings = @(Select-String -Path build.log -Pattern "warning C[0-9]+:" |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
            if ($warnings.Count -gt 0) {
              $message = [string]::Join(" | ", $warnings).Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Host "::warning title=compiler warnings::$message"
            }
          }

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath ctest.log

      - name: Annotate failing tests
        if: failure()
        shell: pwsh
        run: |
          $log = "ctest.log"
          if (Test-Path $log) {
            $diagnosticLines = @(Select-String -Path $log -Pattern "FAIL:|FAIL!|QFATAL|Segmentation|Aborted|Test #[0-9]+:|[0-9]+ - .*\((Failed|Timeout|Not Run)\)|The following tests FAILED|Errors while running CTest|Total Test time|tests failed" | Select-Object -First 8)
            if ($diagnosticLines.Count -gt 0) {
              $diagnosticLines | ForEach-Object { Write-Host "::error title=CTest diagnostic::$($_.Line)" }
            }
            Get-Content $log -Tail 10 | Where-Object { $_.Trim() } |
              ForEach-Object { Write-Host "::error title=CTest output::$($_)" }
          }
          $lastTestLog = "build/Testing/Temporary/LastTest.log"
          if (Test-Path $lastTestLog) {
            Get-Content $lastTestLog -Tail 80 | Where-Object { $_.Trim() } |
              ForEach-Object { Write-Host "::error title=CTest execution detail::$($_)" }
          }

  # ------------------------------------------------------------------ the business layer alone, no Qt needed
  core-only:
    name: Core · g++ · no Qt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the core tests
        run: |
          g++ -std=c++20 -Isrc/core tests/test_core.cpp src/core/*.cpp -o test_core
          ./test_core
