name: Package desktop releases

on:
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "data/**"
      - "assets/**"
      - "packaging/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-appimage:
    name: Linux · x86_64 · AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and AppImage runtime dependencies
        run: |
          set +e
          sudo apt-get update 2>&1 | tee apt-update.log
          update_status=${PIPESTATUS[0]}
          if [ "$update_status" -ne 0 ]; then
            tail -n 25 apt-update.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=apt-get update::$line"
            done
            exit "$update_status"
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-svg-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfuse2 curl desktop-file-utils 2>&1 | tee apt-install.log
          install_status=${PIPESTATUS[0]}
          if [ "$install_status" -ne 0 ]; then
            tail -n 25 apt-install.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=apt-get install::$line"
            done
            exit "$install_status"
          fi

      - name: Select package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPHY104_BUILD_TESTS=OFF
          cmake --build build --parallel 2

      - name: Smoke-test the native build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/src/PHY104OpticalAssistant --screenshots build/smoke-native
          test -s build/smoke-native/dashboard_arabic.png

      - name: Assemble the AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/scalable/apps dist
          cp build/src/PHY104OpticalAssistant AppDir/usr/bin/
          cp -R build/src/data AppDir/usr/bin/data
          cp assets/icons/aperture.svg \
            AppDir/usr/share/icons/hicolor/scalable/apps/phy104-optical-assistant.svg
          cat > AppDir/usr/share/applications/phy104-optical-assistant.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PHY104 Optical Assistant
          Comment=Offline optics lab notebook and simulator
          Exec=PHY104OpticalAssistant
          Icon=phy104-optical-assistant
          Categories=Education;Science;
          Terminal=false
          EOF
          desktop-file-validate AppDir/usr/share/applications/phy104-optical-assistant.desktop
          test -s AppDir/usr/bin/data/formulas.json

      - name: Download pinned linuxdeploy tools
        run: |
          mkdir -p tools/appimage
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output tools/appimage/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output tools/appimage/linuxdeploy-plugin-qt-x86_64.AppImage
          echo "df908b19f1ed1cdafa79508d415aa12d6c56ce4d56d4149aa8c09286718706e5  tools/appimage/linuxdeploy-x86_64.AppImage" | sha256sum --check -
          echo "cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617  tools/appimage/linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum --check -
          chmod +x tools/appimage/linuxdeploy-x86_64.AppImage tools/appimage/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Bundle Qt and create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          EXTRA_QT_MODULES: svg
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        run: |
          export QMAKE="$(command -v qmake6)"
          test -x "$QMAKE"
          ./tools/appimage/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/PHY104OpticalAssistant \
            --desktop-file AppDir/usr/share/applications/phy104-optical-assistant.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/phy104-optical-assistant.svg \
            --plugin qt \
            --output appimage
          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" "dist/PHY104OpticalAssistant-${APP_VERSION}-Linux-x86_64.AppImage"

      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/PHY104OpticalAssistant-${APP_VERSION}-Linux-x86_64.AppImage \
            --screenshots build/smoke-appimage
          test -s build/smoke-appimage/dashboard_arabic.png

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows · x64 · installer and portable ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check "aqtinstall==3.3.*" py7zr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir C:/Qt 2>&1 |
            Tee-Object -FilePath qtinstall-package.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content qtinstall-package.log -Tail 25 | ForEach-Object {
              $line = $_.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
              Write-Host "::error title=Qt install::$line"
            }
            exit 1
          }
          "QT_ROOT_DIR=C:/Qt/6.8.3/msvc2022_64" >> $env:GITHUB_ENV
          "C:/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH

      - name: Select package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release -DPHY104_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the native build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & "build/src/Release/PHY104OpticalAssistant.exe" --screenshots "build/windows-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "build/windows-smoke/dashboard_arabic.png")) { throw "Windows smoke screenshot was not created" }

      - name: Stage the Qt runtime and application data
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist\windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exe = Join-Path $PWD "build\src\Release\PHY104OpticalAssistant.exe"
          $data = Join-Path $PWD "build\src\Release\data"
          Copy-Item $exe $stage
          Copy-Item $data (Join-Path $stage "data") -Recurse
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --compiler-runtime (Join-Path $stage "PHY104OpticalAssistant.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path (Join-Path $stage "Qt6Widgets.dll"))) { throw "Qt runtime was not deployed" }
          if (!(Test-Path (Join-Path $stage "platforms\qwindows.dll"))) { throw "Windows Qt platform plugin was not deployed" }
          if (!(Test-Path (Join-Path $stage "data\formulas.json"))) { throw "Application data was not staged" }

      - name: Create Windows installer and portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $portable = "dist/PHY104OpticalAssistant-$($env:APP_VERSION)-Windows-x64-portable.zip"
          Compress-Archive -Path "dist/windows/*" -DestinationPath $portable -CompressionLevel Optimal
          if (!(Test-Path $portable)) { throw "Windows portable ZIP was not created" }
          $makensisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensisCommand) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $makensisCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          }
          if ($makensisCommand) {
            $makensis = $makensisCommand.Source
          } else {
            $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          }
          if (!(Test-Path $makensis)) { throw "NSIS makensis.exe was not found" }
          & $makensis "/NOCD" "/DAPP_VERSION=$env:APP_VERSION" "packaging/windows/installer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist/PHY104OpticalAssistant-$($env:APP_VERSION)-Windows-x64-Setup.exe")) {
            throw "Windows installer was not created"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*-Windows-x64-Setup.exe
            dist/*-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release with app packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
